name: Public host smoke

on:
  workflow_dispatch:
    inputs:
      app:
        description: Public application to verify after its native deployment
        type: choice
        required: true
        options: [lndy, fhtagn, osstrust, foia]
      expected_revision:
        description: Exact 40-character Git commit expected at deployment.json
        type: string
        required: true
      foia_mode:
        description: FOIA only; writable checks invalid payload rejection without creating data
        type: choice
        required: true
        default: maintenance
        options: [maintenance, writable]

permissions:
  contents: read

concurrency:
  group: public-host-smoke-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/public-host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify public HTTPS and Chromium behavior
        run: npm test
        env:
          SMOKE_APP: ${{ inputs.app }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          FOIA_MODE: ${{ inputs.foia_mode }}
      - name: Keep public acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-host-${{ inputs.app }}-${{ github.run_id }}
          path: tests/public-host/results/
          if-no-files-found: warn
          retention-days: 7
